{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <p class="meta">
    <time>{{ .Date.Format "2006-01-02" }}</time>
    {{ with .Params.tags }}
      · {{ range . }}<a class="tag" href="{{ "/tags/" | relURL }}{{ . | urlize }}/">{{ . }}</a>{{ end }}
    {{ end }}
  </p>
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
